name: Sync upstream and build ImmortalWrt 25.12 x86-64 ISO

on:
  workflow_dispatch:
    inputs:
      luci_version:
        description: "ImmortalWrt 版本"
        required: true
        default: "25.12.1"
        type: choice
        options:
          - "25.12.0"
          - "25.12.1"
      profile:
        description: "软件包空间大小"
        required: true
        default: "1G"
        type: choice
        options:
          - "1G"
          - "2G"
          - "3G"
          - "4G"
      enable_store:
        description: "集成 Store 商店"
        required: true
        default: false
        type: boolean
      include_docker:
        description: "在固件中集成 Docker"
        required: true
        default: "no"
        type: choice
        options:
          - "no"
          - "yes"
      enable_pppoe:
        description: "配置 PPPoE 拨号"
        required: true
        default: "no"
        type: choice
        options:
          - "no"
          - "yes"
      pppoe_account:
        description: "宽带账号（仅 PPPoE=yes 时填写）"
        required: false
      pppoe_password:
        description: "宽带密码（仅 PPPoE=yes 时填写）"
        required: false

permissions:
  contents: write

jobs:
  sync_and_build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout fork
        uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0

      - name: Sync complete upstream master
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/wukongdaily/ImmortalWrt-ImageBuilder.git 2>/dev/null || \
            git remote set-url upstream https://github.com/wukongdaily/ImmortalWrt-ImageBuilder.git
          git fetch upstream master
          if git merge-base --is-ancestor upstream/master HEAD; then
            echo "Fork already contains the latest upstream master."
          else
            # Preserve fork-only commits; stop on conflicts instead of overwriting them.
            git merge --no-edit upstream/master
            git push origin HEAD:master
          fi

      - name: Validate PPPoE inputs
        shell: bash
        run: |
          if [[ "${{ inputs.enable_pppoe }}" == "yes" ]] && \
             { [[ -z "${{ inputs.pppoe_account }}" ]] || [[ -z "${{ inputs.pppoe_password }}" ]]; }; then
            echo "PPPoE=yes 时必须填写账号和密码。"
            exit 1
          fi

      - name: Apply x86_64 build package profile
        shell: bash
        run: |
          set -euo pipefail
          marker="# ======== x86_64 side-router package profile ========"
          if ! grep -Fq "luci-app-adguardhome" shell/apk-custom-packages.sh; then
            cat >> shell/apk-custom-packages.sh <<'EOF'

# ======== x86_64 side-router package profile ========
# OpenClash
CUSTOM_PACKAGES="$CUSTOM_PACKAGES luci-app-openclash luci-compat kmod-tun kmod-inet-diag kmod-nft-tproxy bash curl ip-full unzip"
# AdGuard Home
CUSTOM_PACKAGES="$CUSTOM_PACKAGES adguardhome luci-app-adguardhome"
# MT7921 PCIe passthrough AP support
CUSTOM_PACKAGES="$CUSTOM_PACKAGES kmod-mt7921-common kmod-mt7921-firmware kmod-mt7921e -wpad-basic-mbedtls wpad-openssl wireless-regdb iw iwinfo"
EOF
          fi
          if [[ "${{ inputs.enable_store }}" == "true" ]]; then
            echo 'CUSTOM_PACKAGES="$CUSTOM_PACKAGES luci-app-store"' >> shell/apk-custom-packages.sh
          fi

      - name: Build ImmortalWrt image
        shell: bash
        run: |
          set -euo pipefail
          case "${{ inputs.profile }}" in
            1G) ROOTFS_SIZE=1024 ;;
            2G) ROOTFS_SIZE=2048 ;;
            3G) ROOTFS_SIZE=3072 ;;
            4G) ROOTFS_SIZE=4096 ;;
          esac
          chmod +x x86-64/build25.sh
          docker run --rm -i --user root \
            -v "${{ github.workspace }}/bin:/home/build/immortalwrt/bin" \
            -v "${{ github.workspace }}/files:/home/build/immortalwrt/files" \
            -v "${{ github.workspace }}/custom:/home/build/immortalwrt/files/etc/config" \
            -v "${{ github.workspace }}/x86-64/imm25.config:/home/build/immortalwrt/.config" \
            -v "${{ github.workspace }}/shell:/home/build/immortalwrt/shell" \
            -v "${{ github.workspace }}/x86-64/build25.sh:/home/build/immortalwrt/build.sh" \
            -e PROFILE="$ROOTFS_SIZE" \
            -e INCLUDE_DOCKER="${{ inputs.include_docker }}" \
            -e ENABLE_PPPOE="${{ inputs.enable_pppoe }}" \
            -e PPPOE_ACCOUNT="${{ inputs.pppoe_account }}" \
            -e PPPOE_PASSWORD="${{ inputs.pppoe_password }}" \
            immortalwrt/imagebuilder:x86-64-openwrt-${{ inputs.luci_version }} \
            /bin/bash /home/build/immortalwrt/build.sh

      - name: Prepare image artifact
        shell: bash
        run: |
          cp bin/targets/x86/64/*squashfs-combined-efi.img.gz .
          ls -lh *.img.gz

      - name: Upload image artifact
        uses: actions/upload-artifact@v6
        with:
          name: ImmortalWrt-25.12-x86_64-img
          path: "*.img.gz"

      - name: Build installer ISO
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 https://github.com/wukongdaily/img-installer.git
          chmod +x img-installer/custom.sh img-installer/supportFiles/custom/build.sh
          firmware_file=$(ls *squashfs-combined-efi.img.gz)
          cd img-installer
          bash autobuild/autobuild.sh "../$firmware_file"

      - name: Publish ISO release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "Custom-Installer-x86_64-ISO"
          body_path: "${{ github.workspace }}/img-installer/autobuild/info.md"
          files: "img-installer/output/custom-installer-x86_64.iso"
          token: "${{ secrets.GITHUB_TOKEN }}"
